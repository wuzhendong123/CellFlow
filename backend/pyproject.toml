[project]
name = "cellflow"
version = "0.1.0"
description = "CellFlow：不规则 Excel 的可视化解析配置与自动写表平台（后端）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "cel-python>=0.5",
  "redis>=5.0",
  "arq>=0.25",
  "boto3>=1.34",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "alembic>=1.13", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cellflow*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
