[alembic]
script_location = alembic
# 连接串从环境变量 CF_META_DB_URL 读取（见 alembic/env.py）

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
