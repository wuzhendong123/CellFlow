# 本地开发依赖：MySQL 8（元数据库 + 模拟业务库）、Redis、MinIO（S3 兼容对象存储）
# 用法：docker compose -f deploy/docker-compose.yml up -d
# 所有口令均为本地开发占位值，请勿用于任何共享环境
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CF_LOCAL_MYSQL_ROOT_PASSWORD:-change_me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CF_LOCAL_MINIO_USER:-cellflow}
      MINIO_ROOT_PASSWORD: ${CF_LOCAL_MINIO_PASSWORD:-change_me_minio}
    ports: ["9000:9000", "9001:9001"]
